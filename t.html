        let gold = 0;
        let luck = 0;

                return true;
            } else {
                return false;
            }
        }

        btn1.addEventListener('click', async() => {
            btn1.disabled = true;

            btn1.classList.remove('success-flash');
            void btn1.offsetWidth;
            btn1.classList.add('success-flash'); 

            await wait(1500);

            if(luckedRand(50, 100)){
                
            } else {
                btn1.disabled = false;
            }
        });
    </script>
